<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #video-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        outline: none;
    }

    /* Ocultar completamente los controles nativos */
    video::-webkit-media-controls {
        display: none !important;
    }

    video::-webkit-media-controls-enclosure {
        display: none !important;
    }

    video::-webkit-media-controls-panel {
        display: none !important;
    }

    #debug-log {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.8);
        color: #0f0;
        font-family: monospace;
        font-size: 10px;
        z-index: 9999;
        max-height: 40%;
        overflow-y: auto;
        width: 300px;
        pointer-events: none;
        padding: 10px;
    }

    /* Watermark */
    .watermark {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 120px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 1000;
        user-select: none;
    }

    /* Botón de pantalla completa */
    #fullscreen-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 2000;
        width: 50px;
        height: 45px;
        border: none;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 27px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    #video-container:hover #fullscreen-btn {
        opacity: 1;
    }

    #fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.85);
    }
</style>
</head>

<div id="debug-log"></div>

<div id="video-container">

    <video
        id="video"
        autoplay
        playsinline
        muted
        controls="false"
        controlslist="nodownload noplaybackrate"
        disablepictureinpicture>
    </video>

    <!-- Watermark -->
    <img
        src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
        class="watermark"

</div>
