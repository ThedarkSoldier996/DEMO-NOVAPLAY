<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>DEMO - NOVAPLAY</title>

<link rel="icon" type="image/webp"
href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp">

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #video-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        outline: none;
    }

    video::-webkit-media-controls {
        display: none !important;
    }

    video::-webkit-media-controls-enclosure {
        display: none !important;
    }

    video::-webkit-media-controls-panel {
        display: none !important;
    }

    #debug-log {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.8);
        color: #0f0;
        font-family: monospace;
        font-size: 10px;
        z-index: 9999;
        max-height: 40%;
        overflow-y: auto;
        width: 300px;
        pointer-events: none;
        padding: 10px;
    }

    .watermark {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 120px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 1000;
        user-select: none;
    }

    #fullscreen-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 2000;
        width: 50px;
        height: 45px;
        border: none;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 27px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    #video-container:hover #fullscreen-btn {
        opacity: 1;
    }

    #fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.85);
    }
</style>
</head>

<body>

<div id="debug-log"></div>

<div id="video-container">

    <video
        id="video"
        autoplay
        playsinline
        muted
        controls="false"
        controlslist="nodownload noplaybackrate"
        disablepictureinpicture>
    </video>

    <img
        src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
        class="watermark"
        alt="NovaPlay">

    <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

</div>

<script>
(function() {

    const logger = document.getElementById('debug-log');
    const video = document.getElementById('video');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoContainer = document.getElementById('video-container');

    function log(msg) {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        logger.appendChild(div);
        logger.scrollTop = logger.scrollHeight;
    }

    /* Pantalla completa */
    fullscreenBtn.addEventListener('click', async function() {

        try {

            if (!document.fullscreenElement) {

                await videoContainer.requestFullscreen();
                fullscreenBtn.textContent = '⛶';

            } else {

                await document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';

            }

        } catch (error) {

            log('Error pantalla completa: ' + error.message);

        }

    });

    /* Actualizar botón cuando cambia fullscreen */
    document.addEventListener('fullscreenchange', function() {

        fullscreenBtn.textContent = '⛶';

    });

    async function init() {

        log('Obteniendo Datos desde NOVAPLAY');

        await new Promise(r => setTimeout(r, 800));

        try {

            log('Conectando con Base de Datos...');

            /*
             * URL de novaplay.json codificada en Base64.
             * Se reconstruye únicamente cuando se necesita.
             */
            const encodedUrl =
                "aHR0cHM6Ly9tcmdobm5ndXBvbHNnYXRjbWV2dy5zdXBhYmFzZS5jby9zdG9yYWdlL3YxL29iamVjdC9wdWJsaWMvTm92YXBsYXkvbm92YXBsYXkuanNvbg==";

            const jsonUrl = atob(encodedUrl);

            const response = await fetch(
                jsonUrl + "?t=" + Date.now()
            );

            const data = await response.json();

            log('Usuario DEMO - Sesión Autorizada');

            await new Promise(r => setTimeout(r, 500));

            let targetUrl = "";

            for (const category of data) {

                const channel = category.items.find(
                    ch => ch.name === "TIGO SPORTS 2"
                );

                if (channel) {

                    targetUrl = channel.url;
                    break;

                }

            }

            if (!targetUrl) {

                log('Error: Canal no encontrado.');
                return;

            }

            log('Conexión Establecida. - CARGANDO...');

            await new Promise(r => setTimeout(r, 300));

            if (Hls.isSupported()) {

                const hls = new Hls({

                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    maxBufferSize: 60 * 1024 * 1024,
                    lowLatencyMode: true,
                    backStep: 0.5,
                    startLevel: -1,
                    manifestLoadingMaxRetry: 5,
                    levelLoadingMaxRetry: 5

                });

                hls.loadSource(targetUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {

                    video.play()
                        .then(() => {

                            setTimeout(() => {

                                logger.style.display = 'none';

                            }, 1000);

                        })
                        .catch(e => {

                            log('Error Autoplay: ' + e.message);

                        });

                });

                hls.on(Hls.Events.ERROR, function(event, data) {

                    if (data.fatal) {

                        switch (data.type) {

                            case Hls.ErrorTypes.NETWORK_ERROR:

                                log(
                                    "Error de Conexión con enlace, reintentando..."
                                );

                                hls.startLoad();

                                break;

                            case Hls.ErrorTypes.MEDIA_ERROR:

                                log(
                                    "Error de medios, recuperando..."
                                );

                                hls.recoverMediaError();

                                break;

                            default:

                                log("Fallo fatal.");

                                hls.destroy();

                                break;

                        }

                    }

                });

            } else if (
                video.canPlayType(
                    'application/vnd.apple.mpegurl'
                )
            ) {

                video.src = targetUrl;

                video.addEventListener(
                    'loadedmetadata',
                    () => {

                        video.play()
                            .then(() => {

                                logger.style.display = 'none';

                            })
                            .catch(e => {

                                log(
                                    'Error Autoplay: ' +
                                    e.message
                                );

                            });

                    }
                );

            }

        } catch (error) {

            log('FALLO: ' + error.message);

        }

    }

    init();

})();
</script>

</body>
</html>
