<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>DEMO - NOVAPLAY</title>

<link rel="icon" type="image/webp"
href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp">

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #video-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: #000;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        outline: none;
    }

    /* =========================
       PANTALLA EVENTO FINALIZADO
       ========================= */

    #event-ended {
        position: absolute;
        inset: 0;
        z-index: 5000;

        display: none;

        align-items: center;
        justify-content: center;
        flex-direction: column;

        background: #000;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }

    #event-ended img {
        width: 190px;
        max-width: 45vw;
        margin-bottom: 35px;

        user-select: none;
        -webkit-user-drag: none;
    }

    #event-ended h1 {
        margin: 0 0 15px 0;

        color: #fff;
        font-size: clamp(25px, 4vw, 48px);
        font-weight: 800;
        letter-spacing: 1px;
    }

    #event-ended p {
        margin: 0;

        color: #aaa;
        font-size: clamp(14px, 2vw, 21px);
        line-height: 1.5;
        max-width: 750px;
    }

    #event-status {
        margin-top: 25px;

        color: #666;
        font-size: 12px;
    }

    /* =========================
       DEBUG
       ========================= */

    #debug-log {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.8);
        color: #0f0;
        font-family: monospace;
        font-size: 10px;
        z-index: 9999;
        max-height: 40%;
        overflow-y: auto;
        width: 300px;
        pointer-events: none;
        padding: 10px;
    }

    /* =========================
       MARCA NOVAPLAY
       ========================= */

    .watermark {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 120px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 1000;
        user-select: none;
    }

    /* =========================
       FULLSCREEN
       ========================= */

    #fullscreen-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 2000;

        width: 50px;
        height: 45px;

        border: none;
        border-radius: 6px;

        background: rgba(0, 0, 0, 0.65);
        color: white;

        font-size: 27px;
        cursor: pointer;

        opacity: 0;
        transition: opacity 0.2s ease;
    }

    #video-container:hover #fullscreen-btn {
        opacity: 1;
    }

    #fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.85);
    }
</style>
</head>

<body>

<div id="debug-log"></div>

<div id="video-container">

    <video
        id="video"
        autoplay
        playsinline
        muted
        controls
        controlslist="nodownload noplaybackrate"
        disablepictureinpicture>
    </video>

    <img
        src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
        class="watermark"
        alt="NovaPlay">

    <button id="fullscreen-btn" title="Pantalla completa">⛶</button>


    <!-- =========================
         EVENTO FINALIZADO
         ========================= -->

    <div id="event-ended">

        <img
            src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
            alt="NovaPlay">

        <h1>ESTE EVENTO FINALIZÓ</h1>

        <p>
            El canal se reactivará automáticamente al iniciar
            el próximo evento disponible.
        </p>

        <div id="event-status">
            Esperando próxima transmisión...
        </div>

    </div>

</div>

<script>
(function() {

    const logger = document.getElementById('debug-log');
    const video = document.getElementById('video');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoContainer = document.getElementById('video-container');

    const eventEnded = document.getElementById('event-ended');
    const eventStatus = document.getElementById('event-status');

    let hls = null;
    let currentUrl = "";
    let retryTimer = null;
    let checkTimer = null;

    /*
     * Tiempo que debe pasar sin conseguir una transmisión
     * antes de mostrar "EVENTO FINALIZADO".
     */
    const NO_STREAM_TIMEOUT = 12000;

    /*
     * Cada cuánto se consulta nuevamente novaplay.json.
     *
     * Esto permite detectar automáticamente el próximo evento.
     */
    const CHECK_NEXT_EVENT = 30000;


    function log(msg) {

        const div = document.createElement('div');

        div.textContent = `> ${msg}`;

        logger.appendChild(div);

        logger.scrollTop = logger.scrollHeight;

    }


    /* =========================
       PANTALLA EVENTO FINALIZADO
       ========================= */

    function showEventEnded() {

        log('No se detectó una transmisión activa.');

        video.pause();

        video.removeAttribute('src');

        video.load();

        eventEnded.style.display = 'flex';

        eventStatus.textContent =
            'Esperando próxima transmisión...';

    }


    function hideEventEnded() {

        eventEnded.style.display = 'none';

    }


    /* =========================
       DESTRUIR HLS
       ========================= */

    function destroyPlayer() {

        if (hls) {

            try {
                hls.destroy();
            } catch (e) {}

            hls = null;

        }

        video.pause();

        video.removeAttribute('src');

        video.load();

    }


    /* =========================
       FULLSCREEN
       ========================= */

    fullscreenBtn.addEventListener(
        'click',
        async function() {

            try {

                if (!document.fullscreenElement) {

                    await videoContainer.requestFullscreen();

                    fullscreenBtn.textContent = '⛶';

                } else {

                    await document.exitFullscreen();

                    fullscreenBtn.textContent = '⛶';

                }

            } catch (error) {

                log(
                    'Error pantalla completa: ' +
                    error.message
                );

            }

        }
    );


    document.addEventListener(
        'fullscreenchange',
        function() {

            fullscreenBtn.textContent = '⛶';

        }
    );


    /* =========================
       OBTENER NOVAPLAY.JSON
       ========================= */

    async function getChannelUrl() {

        const encodedUrl =
            "aHR0cHM6Ly9tcmdobm5ndXBvbHNnYXRjbWV2dy5zdXBhYmFzZS5jby9zdG9yYWdlL3YxL29iamVjdC9wdWJsaWMvTm92YXBsYXkvbm92YXBsYXkuanNvbg==";

        const jsonUrl = atob(encodedUrl);

        const response = await fetch(
            jsonUrl + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                'HTTP ' + response.status
            );

        }

        const data = await response.json();


        let targetUrl = "";


        for (const category of data) {

            if (!category.items) {
                continue;
            }

            const channel = category.items.find(
                ch => ch.name === "NOVASPORTS"
            );

            if (channel) {

                targetUrl = channel.url;

                break;

            }

        }


        return targetUrl;

    }


    /* =========================
       INICIAR TRANSMISIÓN
       ========================= */

    function startStream(targetUrl) {

        destroyPlayer();

        hideEventEnded();

        currentUrl = targetUrl;

        log('Intentando conectar con transmisión...');


        let streamDetected = false;

        /*
         * Si después de 12 segundos no se detectó
         * una transmisión válida, mostramos el aviso.
         */

        const noStreamTimer = setTimeout(function() {

            if (!streamDetected) {

                log(
                    'No se detectó transmisión después de ' +
                    NO_STREAM_TIMEOUT +
                    ' ms.'
                );

                showEventEnded();

            }

        }, NO_STREAM_TIMEOUT);


        /* =========================
           HLS.JS
           ========================= */

        if (Hls.isSupported()) {

            hls = new Hls({

                maxBufferLength: 60,

                maxMaxBufferLength: 120,

                maxBufferSize:
                    60 * 1024 * 1024,

                lowLatencyMode: true,

                backStep: 0.5,

                startLevel: -1,

                manifestLoadingMaxRetry: 2,

                levelLoadingMaxRetry: 2

            });


            hls.loadSource(targetUrl);

            hls.attachMedia(video);


            /*
             * Manifest cargado correctamente.
             */

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    streamDetected = true;

                    clearTimeout(noStreamTimer);

                    log(
                        'Transmisión detectada correctamente.'
                    );


                    video.play()
                        .then(function() {

                            setTimeout(function() {

                                logger.style.display =
                                    'none';

                            }, 1000);

                        })
                        .catch(function(e) {

                            log(
                                'Error Autoplay: ' +
                                e.message
                            );

                        });

                }
            );


            /*
             * Primer fragmento recibido.
             *
             * Esto confirma aún más que existe
             * una transmisión real.
             */

            hls.on(
                Hls.Events.FRAG_LOADED,
                function() {

                    streamDetected = true;

                    clearTimeout(noStreamTimer);

                    hideEventEnded();

                }
            );


            /*
             * Errores HLS
             */

            hls.on(
                Hls.Events.ERROR,
                function(event, data) {

                    if (!data.fatal) {
                        return;
                    }


                    switch (data.type) {


                        case Hls.ErrorTypes.NETWORK_ERROR:

                            log(
                                'No se pudo conectar con la transmisión.'
                            );

                            /*
                             * No mostramos inmediatamente
                             * "evento finalizado".
                             *
                             * Esperamos al timeout.
                             */

                            if (!streamDetected) {

                                setTimeout(function() {

                                    if (hls) {

                                        try {

                                            hls.startLoad();

                                        } catch (e) {}

                                    }

                                }, 3000);

                            } else {

                                hls.startLoad();

                            }

                            break;


                        case Hls.ErrorTypes.MEDIA_ERROR:

                            log(
                                'Error de medios. Recuperando...'
                            );

                            try {

                                hls.recoverMediaError();

                            } catch (e) {

                                log(
                                    'No se pudo recuperar el medio.'
                                );

                            }

                            break;


                        default:

                            log(
                                'Fallo fatal de reproducción.'
                            );

                            clearTimeout(
                                noStreamTimer
                            );

                            showEventEnded();

                            break;

                    }

                }
            );


        }

        /* =========================
           SAFARI / HLS NATIVO
           ========================= */

        else if (
            video.canPlayType(
                'application/vnd.apple.mpegurl'
            )
        ) {

            video.src = targetUrl;


            video.addEventListener(
                'loadedmetadata',
                function onMetadata() {

                    streamDetected = true;

                    clearTimeout(noStreamTimer);

                    log(
                        'Transmisión detectada correctamente.'
                    );


                    video.play()
                        .then(function() {

                            setTimeout(function() {

                                logger.style.display =
                                    'none';

                            }, 1000);

                        })
                        .catch(function(e) {

                            log(
                                'Error Autoplay: ' +
                                e.message
                            );

                        });

                },
                {
                    once: true
                }
            );


            video.addEventListener(
                'error',
                function() {

                    if (!streamDetected) {

                        clearTimeout(
                            noStreamTimer
                        );

                        showEventEnded();

                    }

                }
            );

        }

        else {

            clearTimeout(noStreamTimer);

            log(
                'Este navegador no soporta HLS.'
            );

            showEventEnded();

        }

    }


    /* =========================
       BUSCAR EVENTO
       ========================= */

    async function checkForNextEvent() {

        try {

            const newUrl =
                await getChannelUrl();


            if (!newUrl) {

                log(
                    'NOVASPORTS no tiene enlace disponible.'
                );

                return;

            }


            /*
             * Si aparece una URL diferente,
             * significa que probablemente comenzó
             * el siguiente evento.
             */

            if (newUrl !== currentUrl) {

                log(
                    'Nuevo evento detectado. Reactivando canal...'
                );

                logger.style.display = 'block';

                startStream(newUrl);

                return;

            }


            /*
             * Si estamos en pantalla de evento finalizado,
             * volvemos a intentar la misma URL.
             *
             * Esto sirve cuando el servidor mantiene
             * la misma URL pero vuelve a emitir.
             */

            if (
                eventEnded.style.display === 'flex'
            ) {

                log(
                    'Verificando nuevamente la transmisión...'
                );

                startStream(newUrl);

            }

        } catch (error) {

            log(
                'Error verificando próximo evento: ' +
                error.message
            );

        }

    }


    /* =========================
       INICIALIZACIÓN
       ========================= */

    async function init() {

        log(
            'Obteniendo Datos desde NOVAPLAY'
        );

        await new Promise(
            r => setTimeout(r, 800)
        );


        try {

            log(
                'Conectando con Base de Datos...'
            );


            const targetUrl =
                await getChannelUrl();


            log(
                'Usuario DEMO - Sesión Autorizada'
            );


            await new Promise(
                r => setTimeout(r, 500)
            );


            if (!targetUrl) {

                log(
                    'NOVASPORTS no tiene transmisión disponible.'
                );

                showEventEnded();

            } else {

                log(
                    'Conexión Establecida. - CARGANDO...'
                );

                await new Promise(
                    r => setTimeout(r, 300)
                );

                startStream(targetUrl);

            }


            /*
             * Comprobar automáticamente el próximo evento.
             */

            checkTimer = setInterval(
                checkForNextEvent,
                CHECK_NEXT_EVENT
            );


        } catch (error) {

            log(
                'FALLO: ' +
                error.message
            );

            showEventEnded();

            /*
             * Incluso si la primera consulta falla,
             * seguimos intentando.
             */

            checkTimer = setInterval(
                checkForNextEvent,
                CHECK_NEXT_EVENT
            );

        }

    }


    init();


})();
</script>

</body>
</html>
